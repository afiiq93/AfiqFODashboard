<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afiq FO Dashboard — Marine Fuel</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Afiq FO Dashboard</span>
    </div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard" class="nav-link">Dashboard</a>
      <a href="#/entry" data-route="entry" class="nav-link">Data Entry</a>
      <a href="#/news" data-route="news" class="nav-link">News</a>
    </nav>
    <div class="product-pick">
      <select id="productSelect" class="select" aria-label="Product"></select>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="footer">
    <span id="footerStatus">Local data store · changes saved in this browser</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
